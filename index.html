<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>WaniAR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117; color: #e6edf3;
    }
    #game-canvas { display: block; width: 100%; height: 100%; }

    /* --- Loading screen --- */
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0d1117; gap: 16px; transition: opacity .4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 28px; letter-spacing: 2px; }
    #loading .bar { width: 200px; height: 4px; border-radius: 2px; background: #21262d; overflow: hidden; }
    #loading .bar-fill { height: 100%; width: 0%; background: #58a6ff; transition: width .15s; }

    /* --- HUD overlay --- */
    #hud {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      font-size: 11px; background: rgba(0,0,0,.14); padding: 4px 12px;
      border-radius: 12px; pointer-events: none; white-space: nowrap; z-index: 10;
      text-shadow: 0 1px 2px rgba(0,0,0,.5);
    }

    /* --- Touch joystick area (left) --- */
    #joystick-zone {
      position: fixed; left: 0; bottom: 0; width: 50%; height: 45%;
      z-index: 20;
    }
    /* ベースより外側の暗いリング＝ここまで指を押し出すと走る */
    #joystick-run-ring {
      position: absolute;
      border-radius: 50%; box-sizing: border-box;
      border-style: solid;
      border-color: rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 0;
      transition: border-color .12s, opacity .12s;
    }
    #joystick-run-ring.hot {
      border-color: rgba(0, 0, 0, 0.22);
      opacity: 1;
    }
    #joystick-base {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.035); border: 2px solid rgba(255,255,255,.08);
      transition: opacity .15s;
      z-index: 1;
    }
    #joystick-base.active { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); }
    #joystick-thumb {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.12);
      transform: translate(0px, 0px);
      transition: opacity .15s, transform .04s linear;
      z-index: 2;
    }

    /* 左端・画面の縦中央（translateY -50%） */
    #look-reset-btn {
      position: fixed;
      z-index: 21;
      box-sizing: border-box;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.14);
      background: rgba(20, 24, 32, .42);
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
    }
    #look-reset-btn svg {
      display: block;
      width: 54%;
      height: 54%;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    }
    #look-reset-btn:active {
      background: rgba(40, 48, 62, .58);
      transform: translateY(-50%) scale(0.94);
    }

    /* --- Camera preview --- */
    #cam-preview {
      position: fixed; top: 40px; right: 8px;
      width: 160px; height: 120px;
      border-radius: 8px; overflow: hidden;
      z-index: 15; border: 2px solid rgba(255,255,255,.15);
      display: none; background: #000;
    }
    #cam-video, #cam-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #cam-overlay { pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="loading">
    <h1>WaniAR</h1>
    <div class="bar"><div class="bar-fill" id="load-bar"></div></div>
    <p id="load-text">読み込み中…</p>
  </div>

  <div id="hud"><span id="hud-text"></span></div>

  <div id="cam-preview">
    <video id="cam-video" autoplay playsinline muted></video>
    <canvas id="cam-overlay"></canvas>
  </div>

  <button type="button" id="look-reset-btn" aria-label="視点リセット">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </button>

  <div id="joystick-zone">
    <div id="joystick-run-ring" aria-hidden="true"></div>
    <div id="joystick-base"></div>
    <div id="joystick-thumb"></div>
  </div>

  <script type="module" src="/game/frontend/src/main.ts"></script>
</body>
</html>
