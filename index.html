<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>WaniAR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117; color: #e6edf3;
    }
    #game-canvas { display: block; width: 100%; height: 100%; }

    /* --- Loading screen --- */
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0d1117; gap: 16px; transition: opacity .4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 28px; letter-spacing: 2px; }
    #loading .bar { width: 200px; height: 4px; border-radius: 2px; background: #21262d; overflow: hidden; }
    #loading .bar-fill { height: 100%; width: 0%; background: #58a6ff; transition: width .15s; }

    /* --- Tap-to-start overlay --- */
    #tap-start {
      position: fixed; inset: 0; z-index: 99;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(13,17,23,.85); gap: 12px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #tap-start.show { display: flex; }
    #tap-start p { font-size: 20px; font-weight: 700; letter-spacing: 1px; animation: pulse 1.6s ease-in-out infinite; }
    #tap-start span { font-size: 13px; opacity: .6; }
    @keyframes pulse { 0%,100%{ opacity:.7 } 50%{ opacity:1 } }

    /* --- HUD overlay --- */
    #hud {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      font-size: 11px; background: rgba(0,0,0,.14); padding: 4px 12px;
      border-radius: 12px; pointer-events: none; white-space: nowrap; z-index: 10;
      text-shadow: 0 1px 2px rgba(0,0,0,.5);
    }

    /* --- Touch joystick area (left) --- */
    #joystick-zone {
      position: fixed; left: 0; bottom: 0; width: 50%; height: 45%;
      z-index: 20;
    }
    /* ベースより外側の暗いリング＝ここまで指を押し出すと走る */
    #joystick-run-ring {
      position: absolute;
      border-radius: 50%; box-sizing: border-box;
      border-style: solid;
      border-color: rgba(0, 0, 0, 0.12);
      pointer-events: none;
      z-index: 0;
      transition: border-color .12s, opacity .12s;
    }
    #joystick-run-ring.hot {
      border-color: rgba(0, 0, 0, 0.22);
      opacity: 1;
    }
    #joystick-base {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.035); border: 2px solid rgba(255,255,255,.08);
      transition: opacity .15s;
      z-index: 1;
    }
    #joystick-base.active { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); }
    #joystick-thumb {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.12);
      transform: translate(0px, 0px);
      transition: opacity .15s, transform .04s linear;
      z-index: 2;
    }

    /* --- Camera preview --- */
    #cam-preview {
      position: fixed; top: 40px; right: 8px;
      width: 160px; height: 120px;
      border-radius: 8px; overflow: hidden;
      z-index: 15; border: 2px solid rgba(255,255,255,.15);
      display: none; background: #000;
    }
    #cam-video, #cam-overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #cam-overlay { pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="loading">
    <h1>WaniAR</h1>
    <div class="bar"><div class="bar-fill" id="load-bar"></div></div>
    <p id="load-text">読み込み中…</p>
  </div>

  <div id="hud"><span id="hud-text"></span></div>

  <div id="tap-start">
    <p>タップして開始</p>
    <span>カメラを使用してワニを操作します</span>
  </div>

  <div id="cam-preview">
    <video id="cam-video" autoplay playsinline muted></video>
    <canvas id="cam-overlay"></canvas>
  </div>

  <div id="joystick-zone">
    <div id="joystick-run-ring" aria-hidden="true"></div>
    <div id="joystick-base"></div>
    <div id="joystick-thumb"></div>
  </div>

  <script type="module" src="/game/frontend/src/main.ts"></script>
</body>
</html>
