<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>medea-pipeline 収集</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
    main { display: grid; grid-template-columns: 380px 1fr; min-height: 100vh; }
    .panel { padding: 16px; border-right: 1px solid #333; overflow: auto; }
    .row { margin: 10px 0; }
    button { padding: 8px 10px; margin: 4px 4px 0 0; }
    input[type="range"] { width: 100%; }
    #stage { position: relative; display: flex; align-items: center; justify-content: center; }
    #video, #overlay { width: min(960px, 100%); max-height: 95vh; border-radius: 8px; }
    #overlay { position: absolute; pointer-events: none; }
    textarea { width: 100%; min-height: 180px; background: #000; color: #0f0; }
    .small { font-size: 12px; color: #aaa; }
    .ok { color: #7cff8e; }
    .warn { color: #ffce70; }

    .stick-wrap { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: center; }
    #label-stick {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid #4b5;
      background: rgba(60, 120, 80, 0.12);
      touch-action: none;
      user-select: none;
    }
    #label-stick-thumb {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 36px;
      height: 36px;
      margin-left: -18px;
      margin-top: -18px;
      border-radius: 50%;
      background: rgba(120, 255, 160, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transform: translate(0px, 0px);
      pointer-events: none;
    }
    @media (max-width: 900px) {
      main { display: block; }
      .panel {
        border-right: none;
        border-bottom: 1px solid #333;
        max-height: 58vh;
      }
      #stage {
        min-height: 42vh;
        padding: 8px;
      }
      #video, #overlay {
        width: 100%;
        max-height: 40vh;
      }
      textarea { min-height: 120px; }
      .stick-wrap { grid-template-columns: 120px 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h2>medea-pipeline 学習データ収集</h2>
      <div class="row">
        <button id="start">カメラ開始</button>
        <button id="import-json">既存JSON読込</button>
        <input id="import-file" type="file" accept=".json,application/json" style="display:none" />
      </div>
      <div class="row small" id="status">未起動</div>

      <h3>口ラベル（手の開閉）</h3>
      <div class="row">
        <button id="capture-open">手を開いた状態を記録</button>
        <button id="capture-closed">手を閉じた状態を記録</button>
      </div>

      <h3>首ラベル（向き）</h3>
      <div class="row small">スティックで向きを指定して「向きラベルを記録」を押します。</div>
      <div class="row stick-wrap">
        <div id="label-stick">
          <div id="label-stick-thumb"></div>
        </div>
        <div>
          <div class="small">yaw: <span id="yaw-value">0.00</span></div>
          <input id="yaw" type="range" min="-0.7" max="0.7" step="0.01" value="0" />
          <div class="small">pitch: <span id="pitch-value">0.00</span></div>
          <input id="pitch" type="range" min="-0.5" max="0.5" step="0.01" value="0" />
          <button id="stick-center">スティック中央に戻す</button>
        </div>
      </div>
      <div class="row"><button id="capture-tilt">向きラベルを記録</button></div>

      <h3>データ管理</h3>
      <div class="row">
        <button id="export">JSON出力（前回分に追加）</button>
        <button id="clear-session">今回分だけ削除</button>
        <button id="clear-all">全データ削除</button>
      </div>
      <div class="row small">
        既存: <span id="count-base">0</span>,
        今回: <span id="count-session">0</span>,
        合計: <span id="count-total">0</span>,
        open: <span id="count-open">0</span>,
        closed: <span id="count-closed">0</span>,
        向き: <span id="count-tilt">0</span>
      </div>
      <textarea id="output" placeholder="JSON出力結果がここに表示されます"></textarea>
      <p class="small">保存先例: <code>medea-pipeline/data/hand-dataset.json</code></p>
    </section>

    <section id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </section>
  </main>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34';

    const STORAGE_KEY = 'medea_pipeline_dataset_v1';

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');
    const yawEl = document.getElementById('yaw');
    const pitchEl = document.getElementById('pitch');
    const yawValueEl = document.getElementById('yaw-value');
    const pitchValueEl = document.getElementById('pitch-value');
    const countBaseEl = document.getElementById('count-base');
    const countSessionEl = document.getElementById('count-session');
    const countTotalEl = document.getElementById('count-total');
    const countOpenEl = document.getElementById('count-open');
    const countClosedEl = document.getElementById('count-closed');
    const countTiltEl = document.getElementById('count-tilt');
    const importFileEl = document.getElementById('import-file');
    const stickEl = document.getElementById('label-stick');
    const stickThumbEl = document.getElementById('label-stick-thumb');

    let landmarker = null;
    let running = false;
    let lastFeatures = null;
    let baseSamples = [];
    const sessionSamples = [];

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className = `small ${cls}`;
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function readDatasetFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed?.samples) ? parsed.samples : [];
      } catch {
        return [];
      }
    }

    function writeDatasetToStorage(samples) {
      const payload = { version: 1, createdAt: new Date().toISOString(), samples };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function allSamples() {
      return [...baseSamples, ...sessionSamples];
    }

    /** ゲーム本体の main.ts と同じ。非ミラー映像で首・口特徴の上下左右を体感に合わせる */
    function landmarksForHandControl(lm) {
      return lm.map((p) => ({ x: 1 - p.x, y: 1 - p.y, z: p.z }));
    }

    function extractFeatures(lm) {
      const wrist = lm[0];
      const midMCP = lm[9];
      const handSize = Math.hypot(wrist.x - midMCP.x, wrist.y - midMCP.y, wrist.z - midMCP.z);
      const pairs = [[8, 5], [12, 9], [16, 13], [20, 17]];
      let sum = 0;
      for (const [tip, mcp] of pairs) {
        sum += Math.hypot(lm[tip].x - lm[mcp].x, lm[tip].y - lm[mcp].y, lm[tip].z - lm[mcp].z);
      }
      const avgCurl = handSize > 0.01 ? (sum / 4) / handSize : 0;
      const dx = midMCP.x - wrist.x;
      const dy = midMCP.y - wrist.y;
      const dz = midMCP.z - wrist.z;
      const tiltAngle = Math.atan2(dx, -dy);
      const pitchAngle = Math.atan2(dz, Math.hypot(dx, dy));
      return { avgCurl, tiltAngle, pitchAngle };
    }

    function draw(lm) {
      const ctx = overlay.getContext('2d');
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      if (!lm) return;
      const links = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
      ctx.strokeStyle = 'rgba(0,255,136,.5)';
      for (const [a, b] of links) {
        ctx.beginPath();
        ctx.moveTo(lm[a].x * overlay.width, lm[a].y * overlay.height);
        ctx.lineTo(lm[b].x * overlay.width, lm[b].y * overlay.height);
        ctx.stroke();
      }
      ctx.fillStyle = '#00ff88';
      for (const p of lm) {
        ctx.beginPath();
        ctx.arc(p.x * overlay.width, p.y * overlay.height, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function refreshCount() {
      const merged = allSamples();
      let open = 0;
      let closed = 0;
      let tilt = 0;
      for (const s of merged) {
        if (s.mouthLabel === 1) open += 1;
        if (s.mouthLabel === 0) closed += 1;
        if (Number.isFinite(s.targetYaw) || Number.isFinite(s.targetPitch)) tilt += 1;
      }
      countBaseEl.textContent = String(baseSamples.length);
      countSessionEl.textContent = String(sessionSamples.length);
      countTotalEl.textContent = String(merged.length);
      countOpenEl.textContent = String(open);
      countClosedEl.textContent = String(closed);
      countTiltEl.textContent = String(tilt);
    }

    async function exportMergedJson() {
      const merged = allSamples();
      const payload = { version: 1, createdAt: new Date().toISOString(), samples: merged };
      outputEl.value = JSON.stringify(payload, null, 2);
      writeDatasetToStorage(merged);
      baseSamples = merged;
      sessionSamples.length = 0;
      refreshCount();
      setStatus('JSON出力しました。自動学習を実行中…', 'warn');

      try {
        const res = await fetch('/api/pipeline/train', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const result = await res.json();
        if (!res.ok || !result?.ok) {
          throw new Error(result?.message || `HTTP ${res.status}`);
        }
        setStatus('JSON保存と自動学習が完了しました（ゲームへ反映済み）', 'ok');
      } catch (e) {
        setStatus(`JSON保存は完了。自動学習失敗: ${e.message || e}`, 'warn');
      }
    }

    async function openCameraStreamPreferRear() {
      const tries = [
        { video: { facingMode: { exact: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } } },
        { video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } } },
        { video: { facingMode: { ideal: 'user' }, width: { ideal: 640 }, height: { ideal: 480 } } },
        { video: true },
      ];
      let lastErr = null;
      for (const c of tries) {
        try {
          return await navigator.mediaDevices.getUserMedia(c);
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('camera open failed');
    }

    async function start() {
      setStatus('起動中…', 'warn');
      const stream = await openCameraStreamPreferRear();
      video.srcObject = stream;
      await video.play();
      video.style.transform = '';
      overlay.style.transform = '';
      overlay.width = video.videoWidth || 640;
      overlay.height = video.videoHeight || 480;

      const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34/wasm');
      landmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
          delegate: 'GPU',
        },
        runningMode: 'VIDEO',
        numHands: 1,
      });
      running = true;
      setStatus('起動済み（右手を映してください）', 'ok');
    }

    function captureSample(partial) {
      if (!lastFeatures) {
        setStatus('手が検出されてから記録してください', 'warn');
        return;
      }
      sessionSamples.push({
        avgCurl: lastFeatures.avgCurl,
        tiltAngle: lastFeatures.tiltAngle,
        pitchAngle: lastFeatures.pitchAngle,
        mouthLabel: partial.mouthLabel ?? null,
        targetYaw: partial.targetYaw ?? null,
        targetPitch: partial.targetPitch ?? null,
      });
      refreshCount();
    }

    function loop(ts) {
      requestAnimationFrame(loop);
      if (!running || !landmarker || video.readyState < 2) return;
      const r = landmarker.detectForVideo(video, ts || performance.now());
      const lm = r?.landmarks?.[0];
      if (!lm) {
        draw(null);
        return;
      }
      draw(lm);
      lastFeatures = extractFeatures(landmarksForHandControl(lm));
    }
    requestAnimationFrame(loop);

    function syncSliders() {
      const y = clamp(Number(yawEl.value), -0.7, 0.7);
      const p = clamp(Number(pitchEl.value), -0.5, 0.5);
      yawEl.value = String(y);
      pitchEl.value = String(p);
      yawValueEl.textContent = y.toFixed(2);
      pitchValueEl.textContent = p.toFixed(2);
      const rx = (y / 0.7) * 42;
      const ry = (-p / 0.5) * 42;
      stickThumbEl.style.transform = `translate(${rx}px, ${ry}px)`;
    }

    function setStickByPointer(clientX, clientY) {
      const rect = stickEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const maxR = 42;
      const dist = Math.hypot(dx, dy);
      const r = dist > maxR ? maxR / dist : 1;
      const nx = dx * r;
      const ny = dy * r;
      const targetYaw = clamp((nx / maxR) * 0.7, -0.7, 0.7);
      const targetPitch = clamp((-ny / maxR) * 0.5, -0.5, 0.5);
      yawEl.value = String(targetYaw);
      pitchEl.value = String(targetPitch);
      syncSliders();
    }

    let stickDragging = false;
    stickEl.addEventListener('pointerdown', (e) => {
      stickDragging = true;
      setStickByPointer(e.clientX, e.clientY);
      stickEl.setPointerCapture(e.pointerId);
    });
    stickEl.addEventListener('pointermove', (e) => {
      if (!stickDragging) return;
      setStickByPointer(e.clientX, e.clientY);
    });
    stickEl.addEventListener('pointerup', () => { stickDragging = false; });
    stickEl.addEventListener('pointercancel', () => { stickDragging = false; });

    document.getElementById('start').addEventListener('click', async () => {
      try {
        await start();
      } catch (e) {
        setStatus(`起動失敗: ${e.message || e}`, 'warn');
      }
    });
    document.getElementById('capture-open').addEventListener('click', () => captureSample({ mouthLabel: 1 }));
    document.getElementById('capture-closed').addEventListener('click', () => captureSample({ mouthLabel: 0 }));
    document.getElementById('capture-tilt').addEventListener('click', () => {
      captureSample({ targetYaw: Number(yawEl.value), targetPitch: Number(pitchEl.value) });
    });
    document.getElementById('stick-center').addEventListener('click', () => {
      yawEl.value = '0';
      pitchEl.value = '0';
      syncSliders();
    });
    document.getElementById('clear-session').addEventListener('click', () => {
      sessionSamples.length = 0;
      refreshCount();
      outputEl.value = '';
      setStatus('今回の収集データを削除しました', 'warn');
    });
    document.getElementById('clear-all').addEventListener('click', () => {
      sessionSamples.length = 0;
      baseSamples = [];
      localStorage.removeItem(STORAGE_KEY);
      refreshCount();
      outputEl.value = '';
      setStatus('全データを削除しました', 'warn');
    });
    document.getElementById('export').addEventListener('click', () => { void exportMergedJson(); });

    document.getElementById('import-json').addEventListener('click', () => importFileEl.click());
    importFileEl.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const imported = Array.isArray(parsed?.samples) ? parsed.samples : [];
        baseSamples = imported;
        writeDatasetToStorage(baseSamples);
        refreshCount();
        setStatus(`既存JSONを読み込みました: ${imported.length}件`, 'ok');
      } catch (err) {
        setStatus(`JSON読込失敗: ${err.message || err}`, 'warn');
      } finally {
        importFileEl.value = '';
      }
    });

    yawEl.addEventListener('input', syncSliders);
    pitchEl.addEventListener('input', syncSliders);
    baseSamples = readDatasetFromStorage();
    refreshCount();
    syncSliders();
    if (baseSamples.length > 0) {
      setStatus(`前回の学習データを読み込みました: ${baseSamples.length}件`, 'ok');
    }
  </script>
</body>
</html>
